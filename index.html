<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給食管理ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0e8;
      --card-bg: #fff;
      --accent-orange: #e8732a;
      --accent-green: #4a9e6b;
      --text-dark: #2b2416;
      --text-mid: #5a5040;
      --text-light: #9a8e7a;
      --shadow: 0 4px 24px rgba(43,36,22,0.10);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* 背景の装飾 */
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(232,115,42,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -150px; right: -150px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(74,158,107,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .header .icon {
      font-size: 52px;
      margin-bottom: 12px;
      display: block;
      animation: pop 0.5s 0.2s cubic-bezier(.34,1.56,.64,1) both;
    }

    .header h1 {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-weight: 900;
      font-size: clamp(24px, 6vw, 32px);
      color: var(--text-dark);
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    .header p {
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    /* カード */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 28px;
      text-decoration: none;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), 
                  box-shadow 0.22s ease,
                  border-color 0.22s ease;
      animation: fadeUp 0.6s ease both;
      cursor: pointer;
    }

    .card:nth-child(1) { animation-delay: 0.15s; }
    .card:nth-child(2) { animation-delay: 0.28s; }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 10px 40px rgba(43,36,22,0.15);
    }

    .card.orange:hover { border-color: var(--accent-orange); }
    .card.green:hover  { border-color: var(--accent-green); }

    .card-icon {
      width: 68px; height: 68px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .card:hover .card-icon {
      transform: scale(1.12) rotate(-4deg);
    }
    .card.orange .card-icon { background: #fff3ea; }
    .card.green  .card-icon { background: #edf7f1; }

    .card-body { flex: 1; }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .card.orange .card-label { color: var(--accent-orange); }
    .card.green  .card-label { color: var(--accent-green); }

    .card-title {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.6;
    }

    .card-arrow {
      font-size: 20px;
      color: var(--text-light);
      transition: transform 0.2s ease, color 0.2s ease;
      flex-shrink: 0;
    }
    .card.orange:hover .card-arrow { color: var(--accent-orange); transform: translateX(4px); }
    .card.green:hover  .card-arrow { color: var(--accent-green);  transform: translateX(4px); }

    /* フッター */
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-light);
      animation: fadeUp 0.6s 0.4s ease both;
    }

    /* アニメーション */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 400px) {
      .card { padding: 20px 18px; gap: 14px; }
      .card-icon { width: 54px; height: 54px; font-size: 26px; border-radius: 12px; }
      .card-title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="header">
      <span class="icon">🍱</span>
      <h1>給食管理ツール</h1>
      <p>使用するツールを選んでください</p>
    </div>

    <div class="cards">

      <a class="card orange" href="divide.html">
        <div class="card-icon">➗</div>
        <div class="card-body">
          <div class="card-label">divide</div>
          <div class="card-title">食数割り当て計算</div>
          <div class="card-desc">クラスごとの食数を割り振る計算ツール</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <a class="card green" href="percentage.html">
        <div class="card-icon">📊</div>
        <div class="card-body">
          <div class="card-label">percentage</div>
          <div class="card-title">残食率計算</div>
          <div class="card-desc">残食量から残食率をすばやく算出するツール</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

    </div>

    <div class="footer">給食管理サポートツール</div>

  </div>
</body>
</html>
