<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食材計算アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .main-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .section {
            flex: 1;
        }
        
        .section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        .section-title {
            color: #495057;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #6c757d;
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .result {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            text-align: right;
        }
        
        .result-grid {
            display: grid;
            gap: 10px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-label {
            color: #6c757d;
            font-size: 13px;
            font-weight: 500;
        }
        
        .result-value {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
            font-weight: bold;
            color: #667eea;
            min-width: 90px;
            text-align: right;
            font-size: 14px;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        
        .button-row {
            display: flex;
            gap: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .section {
                padding: 10px;
            }
            
            .section-title {
                font-size: 14px;
            }
            
            .result-label {
                font-size: 12px;
            }
            
            .result-value {
                font-size: 13px;
                min-width: 70px;
                padding: 6px 8px;
            }
            
            .button-row {
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }
            
            button {
                width: 100%;
                font-size: 12px;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-grid">
            <div class="section">
                <div class="section-title">食材の数値</div>
                <div class="input-group">
                    <label for="foodValue">数値を入力</label>
                    <input type="number" id="foodValue" placeholder="数値を入力してください" step="0.001">
                </div>
                
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">34%:</span>
                        <div class="result-value" id="result34">0.000</div>
                    </div>
                    <div class="result-item">
                        <span class="result-label">33%:</span>
                        <div class="result-value" id="result33">0.000</div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">1釜目の値</div>
                <div class="input-group">
                    <label for="firstPot">数値を入力</label>
                    <input type="number" id="firstPot" placeholder="数値を入力してください" step="0.001">
                </div>
                
                <div class="result-grid">
                    <div class="result-item">
                        <span class="result-label">2・3釜目:</span>
                        <div class="result-value" id="secondPot">0.000</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="button-container">
            <div class="button-row">
                <button onclick="clearFood()">🗑️ 食材の数値をクリア</button>
                <button onclick="clearPot()">🗑️ 1釜目の値をクリア</button>
            </div>
            <button onclick="clearAll()">🗑️ すべてクリア</button>
        </div>
    </div>
    
    <script>
        const foodValueInput = document.getElementById('foodValue');
        const firstPotInput = document.getElementById('firstPot');
        const result34 = document.getElementById('result34');
        const result33 = document.getElementById('result33');
        const secondPot = document.getElementById('secondPot');
        
        function calculate() {
            const foodValue = parseFloat(foodValueInput.value) || 0;
            const firstPotValue = parseFloat(firstPotInput.value) || 0;
            
            // 34%と33%の計算
            const value34 = foodValue * 0.34;
            const value33 = foodValue * 0.33;
            
            // 2釜目の値の計算: (食材の数値 - 1釜目の値) ÷ 2
            const secondPotValue = (foodValue - firstPotValue) / 2;
            
            // 小数第3位まで表示
            result34.textContent = value34.toFixed(3);
            result33.textContent = value33.toFixed(3);
            secondPot.textContent = secondPotValue.toFixed(3);
        }
        
        function clearFood() {
            foodValueInput.value = '';
            calculate();
        }
        
        function clearPot() {
            firstPotInput.value = '';
            calculate();
        }
        
        function clearAll() {
            foodValueInput.value = '';
            firstPotInput.value = '';
            result34.textContent = '0.000';
            result33.textContent = '0.000';
            secondPot.textContent = '0.000';
        }
        
        // 入力値が変更されたら自動計算
        foodValueInput.addEventListener('input', calculate);
        firstPotInput.addEventListener('input', calculate);
    </script>
</body>
</html>
